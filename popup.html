<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>回退设置</title>
  </head>
  <body>
    <main>
      <div class="brand"><span class="icon">↶</span><span>Spotify 回退</span></div>
      <h1>每次回退</h1>
      <form id="settings-form">
        <div class="presets" aria-label="常用秒数">
          <button type="button" data-seconds="1">1 秒</button>
          <button type="button" data-seconds="5">5 秒</button>
          <button type="button" data-seconds="10">10 秒</button>
          <button type="button" data-seconds="15">15 秒</button>
          <button type="button" data-seconds="30">30 秒</button>
        </div>
        <label for="seconds">自定义（1–600 秒）</label>
        <div class="input-row">
          <input id="seconds" name="seconds" type="number" min="1" max="600" step="1" required>
          <span>秒</span>
          <button type="submit">保存</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
